<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>aidentity — your account workspace</title>
  <!-- The brand mark in hex: a favicon cannot read the stylesheet's variables (#060606 ground, #5fe08a Mint). -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'%3E%3Crect width='32' height='32' rx='7' fill='%23060606'/%3E%3Crect x='5' y='3' width='15' height='23' rx='6' stroke='%235fe08a' stroke-width='2.5'/%3E%3Crect x='12' y='6' width='15' height='23' rx='6' fill='%23060606' stroke='%235fe08a' stroke-width='2.5'/%3E%3Ccircle cx='20' cy='18' r='3' fill='%235fe08a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/experience.css">
  <script src="/experience.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to workspace</a>
  <div class="app-shell">
    <button id="nav-scrim" class="nav-scrim" aria-label="Close navigation" hidden></button>
    <nav id="sidebar" class="sidebar" aria-label="Main">
      <button id="nav-close" class="icon-button nav-close" aria-label="Close navigation" title="Close navigation"><span data-icon="x"></span></button>
      <a href="#explore" class="brand" title="aidentity">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="5" y="3" width="15" height="23" rx="6" stroke="currentColor" stroke-width="2.5"/><rect x="12" y="6" width="15" height="23" rx="6" fill="var(--ground)" stroke="currentColor" stroke-width="2.5"/><circle cx="20" cy="18" r="3" fill="currentColor"/></svg>
        <span class="nav-label">aidentity<span class="brand-sub">One app. Every account.</span></span>
      </a>
      <div class="scope" role="status" title="Connected to this Mac"><span class="connection-dot"></span><span class="nav-label"><span id="connection-state">Connected</span> · this Mac</span></div>
      <div id="primary-nav"></div>
      <div class="nav-apps"><div class="nav-group-title nav-label">Your apps</div><div id="app-nav"></div></div>
      <div class="sidebar-foot">
        <button class="nav-item section-guide" data-view="guide" title="Help"><span class="tile" aria-hidden="true"><span data-icon="book"></span></span><span class="nav-label">Help</span></button>
        <div class="version-row"><span id="version">aidentity</span><button id="collapse-nav" class="icon-button" aria-label="Collapse sidebar" title="Collapse sidebar"><span data-icon="panel"></span></button></div>
      </div>
    </nav>
    <div class="main-shell">
      <header class="topbar">
        <div class="topbar-leading"><button id="mobile-nav" class="icon-button" aria-label="Open navigation" aria-expanded="false"><span data-icon="menu"></span></button><span id="topbar-title" class="topbar-title" aria-hidden="true"></span></div>
        <div class="topbar-actions"><span id="freshness" class="freshness">Connecting…</span><button id="refresh" class="icon-button" aria-label="Refresh" title="Refresh"><span data-icon="refresh"></span></button><button class="button button-primary" id="header-add"><span data-icon="plus"></span><span>Add profile</span></button></div>
      </header>
      <div id="connection-banner" class="connection-banner" role="alert" hidden></div>
      <main id="main" tabindex="-1"><div class="initial-loading"><span class="spinner" aria-hidden="true"></span><h1>Connecting to your workspace</h1><p>Reading apps and profile launchers on this Mac.</p></div></main>
      <button id="activity-toggle" class="activity-toggle" aria-expanded="false" aria-controls="activity-panel" hidden><span data-icon="terminal"></span><span id="activity-summary">Activity · Nothing run yet</span><span data-icon="chevron"></span></button>
      <section id="activity-panel" class="activity-panel" aria-label="Operation activity" hidden><div class="panel-heading"><h2 id="activity-title" tabindex="-1">Activity</h2><button id="activity-close" class="icon-button" aria-label="Close activity"><span data-icon="x"></span></button></div><div id="activity-content"><p class="muted">Nothing run yet. Each action you run shows up here with its command.</p></div></section>
    </div>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description"></dialog>
  <section id="toast-viewport" class="toast-viewport" aria-label="Notifications"></section>
</body>
</html>
