name: Pages

# Publishes the landing page: site/ plus the logo, icon and demo GIF from
# assets/. It runs only when one of those changes on main, or by hand.

# Quoted so YAML does not read "on" as the boolean true.
"on":
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/logo.svg"
      - "assets/icon-1024.png"
      - "assets/demo.gif"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits instead of cancelling one that
# is half published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble the site
        run: |
          set -eu
          mkdir -p _site/assets
          cp -R site/. _site/
          cp assets/logo.svg assets/icon-1024.png assets/demo.gif _site/assets/

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
