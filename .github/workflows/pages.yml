name: Pages

# Publishes the landing page in site/. It runs only when site/ or this
# workflow changes on main, or by hand.

# Quoted so YAML does not read "on" as the boolean true.
"on":
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits instead of cancelling one that
# is half published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble the site
        run: |
          set -eu
          mkdir -p _site
          cp -R site/. _site/

      # Every local file a page points to must be in the upload, or the deploy
      # stops here instead of publishing a broken page. Pages in subfolders
      # count too. A path that starts with / is read from the site root, any
      # other path from the page's own folder.
      - name: Check the site
        run: |
          set -eu
          missing=0
          for page in $(find _site -name '*.html' | sort); do
            dir=$(dirname "$page")
            for ref in $(grep -oE '(src|href|poster)="[^"]*"' "$page" | sed -E 's/^[a-z]+="//; s/"$//' | sort -u); do
              case "$ref" in http:*|https:*|mailto:*|data:*|javascript:*|\#*|'') continue ;; esac
              path="${ref%%[#?]*}"
              [ -n "$path" ] || continue
              case "$path" in
                /*) file="_site$path" ;;
                *)  file="$dir/$path" ;;
              esac
              if [ ! -e "$file" ]; then
                echo "::error::$page points to $ref, which is not in the site"
                missing=1
              fi
            done
          done
          exit "$missing"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
