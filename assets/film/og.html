<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>aidentity social card</title>
<!-- The card that shows when a link to the site is shared: 1200x630.
     render.sh draws it with the image's Chromium, next to the film. -->
<style>
  @font-face { font-family: "AidSans"; src: url("fonts/InterDisplay-Medium.otf"); font-weight: 500; }
  @font-face { font-family: "AidSans"; src: url("fonts/InterDisplay-SemiBold.otf"); font-weight: 600; }
  @font-face { font-family: "AidText"; src: url("fonts/Inter-SemiBold.otf"); font-weight: 600; }
  @font-face { font-family: "AidText"; src: url("fonts/Inter-Bold.otf"); font-weight: 700; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #000; }
  body { position: relative; font-family: "AidSans", sans-serif; color: #F5F5F7; }
  .glow { position: absolute; left: 560px; top: 250px; width: 700px; height: 420px; background: radial-gradient(closest-side, rgba(41,151,255,.20), rgba(41,151,255,0)); }
  .brand { position: absolute; left: 80px; top: 66px; display: flex; align-items: center; gap: 14px; font-size: 32px; font-weight: 600; letter-spacing: -0.02em; }
  .brand img { width: 46px; height: 46px; }
  h1 { position: absolute; left: 80px; top: 158px; font-size: 96px; line-height: 100px; font-weight: 600; letter-spacing: -0.03em; white-space: nowrap; }
  h1 span { display: block; color: #86868B; }
  .lead { position: absolute; left: 80px; top: 392px; font-size: 34px; line-height: 42px; font-weight: 500; letter-spacing: -0.012em; color: #D2D2D7; }
  .free { position: absolute; left: 80px; top: 528px; font-size: 24px; line-height: 30px; font-weight: 500; color: #86868B; }
  /* The launchers: the app's icon (app.svg, which keeps a margin of a tenth on each side) with
     the account's letter on a coloured badge. The boxes overlap by that margin. */
  .icons { position: absolute; right: 65.5px; top: 371.5px; display: flex; gap: 3px; }
  .ic { width: 145px; text-align: center; font: 600 21px/26px "AidText", sans-serif; }
  .ic svg { display: block; width: 145px; height: 145px; margin-bottom: -.5px; overflow: visible; filter: drop-shadow(0 12px 16px rgba(0,0,0,.6)); }
  .bl { font: 700 26.4px "AidText", sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: central; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- The badge aidentity draws on a launcher's icon: a ring, and a disc in the account's colour (--b). -->
  <symbol id="badge" viewBox="0 0 100 100"><circle cx="75" cy="75" r="24.2" fill="#fff" fill-opacity=".96"/><circle cx="75" cy="75" r="22" style="fill:var(--b)"/></symbol>
</svg>
<div class="glow"></div>
<div class="brand"><img src="logo.svg" alt="">aidentity</div>
<h1>Every account.<span>Open at once.</span></h1>
<p class="lead">Stop signing out to switch accounts.</p>
<p class="free">Free and open source, for your Mac</p>
<div class="icons">
  <div class="ic"><svg viewBox="0 0 100 100" style="--b:#2E7DF6"><image href="app.svg" width="100" height="100"/><use href="#badge"/><text class="bl" x="75" y="75.5">W</text></svg>Work</div>
  <div class="ic"><svg viewBox="0 0 100 100" style="--b:#2FB344"><image href="app.svg" width="100" height="100"/><use href="#badge"/><text class="bl" x="75" y="75.5">P</text></svg>Personal</div>
  <div class="ic"><svg viewBox="0 0 100 100" style="--b:#F76B15"><image href="app.svg" width="100" height="100"/><use href="#badge"/><text class="bl" x="75" y="75.5">C</text></svg>Client</div>
</div>
</body>
</html>
